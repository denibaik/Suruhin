name: CI — Lint & Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Catatan: Deploy otomatis ditangani oleh Digital Ocean App Platform
# yang terhubung langsung ke repo GitHub ini.

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependensi
        run: bun install --frozen-lockfile

      - name: Build check (Node.js preset)
        run: bun run build:azure
        env:
          NITRO_PRESET: node-server
